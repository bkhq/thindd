[package]
name        = "thindd-core"
version     = "1.2.1"
description = "Block-map (bmap) parsing, generation and zero-elided image copying"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
readme                 = "../../README.md"
keywords               = ["bmap", "image", "flash", "sparse", "embedded"]
categories             = ["filesystem", "embedded", "command-line-utilities"]

[features]
default = ["gzip"]
## Transparent decompression of gzip-compressed images.
gzip = ["dep:flate2"]

[lints]
workspace = true

[dependencies]
flate2    = { workspace = true, optional = true }
hex       = { workspace = true }
roxmltree = { workspace = true }
rustix    = { workspace = true }
sha1      = { workspace = true }
sha2      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
flate2   = { workspace = true }
tempfile = { workspace = true }
